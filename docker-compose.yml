version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - 8081
    environment:
      PORT: ${PORT:-8081}
      DB_URL: ${DB_URL}
      DB_MIGRATION_URL: ${DB_MIGRATION_URL}
    env_file:
      - .env
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test-api-gbns8g-6.rule=Host(`api.stork-corp.xyz`)"
      - "traefik.http.routers.test-api-gbns8g-6.entrypoints=websecure"
      - "traefik.http.routers.test-api-gbns8g-6.tls.certResolver=letsencrypt"
      - "traefik.http.services.test-api-gbns8g-6.loadbalancer.server.port=8081"

networks:
  dokploy-network:
    external: true
